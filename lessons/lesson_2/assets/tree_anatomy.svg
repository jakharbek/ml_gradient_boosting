<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 268" font-family="system-ui, Segoe UI, sans-serif" role="img" aria-label="Дерево глубины 2 на восьми квартирах: корень, два внутренних узла, четыре листа">
  <title>Анатомия дерева решений</title>
  <style>
    .bg { fill: #fcfcfb; }
