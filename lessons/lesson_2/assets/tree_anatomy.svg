  </style>
  <rect class="bg" width="460" height="268" rx="10"/>
  <line class="lvl" x1="96" y1="37" x2="452" y2="37"/><line class="lvl" x1="96" y1="121" x2="452" y2="121"/><line class="lvl" x1="96" y1="204" x2="452" y2="204"/>
  <text class="cap" x="8" y="33">корень</text><text class="lab" x="8" y="47">уровень 0</text>
  <text class="cap" x="8" y="117">узлы</text><text class="lab" x="8" y="131">уровень 1</text>
  <text class="cap" x="8" y="200">листья</text><text class="lab" x="8" y="214">уровень 2</text>
  <path class="e" d="M270 58 C 270 80, 180 80, 180 100"/>
