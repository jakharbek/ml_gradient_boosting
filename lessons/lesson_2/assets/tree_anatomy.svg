  <text class="t" x="270" y="36" text-anchor="middle">площадь ≤ 56</text><text class="s" x="270" y="51" text-anchor="middle">8 квартир</text>
  <rect class="n" x="118" y="100" width="124" height="42" rx="9"/>
  <text class="t" x="180" y="120" text-anchor="middle">до центра ≤ 6.5</text><text class="s" x="180" y="135" text-anchor="middle">4 квартиры</text>
