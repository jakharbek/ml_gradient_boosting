  <rect class="l" x="188" y="184" width="74" height="40" rx="9" fill="#9ec5f4"/><text class="t" x="225" y="203" text-anchor="middle">3.3</text><text class="s" x="225" y="217" text-anchor="middle">2 кв.</text>
  <rect class="l" x="278" y="184" width="74" height="40" rx="9" fill="#f0a3a2"/><text class="t" x="315" y="203" text-anchor="middle">10.1</text><text class="s" x="315" y="217" text-anchor="middle">2 кв.</text>
